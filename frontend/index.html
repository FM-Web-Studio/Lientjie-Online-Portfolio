<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="96x96" href="/logo-96.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/logo-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lientjie Meiring - Architecture Student & Designer, University of Johannesburg" />
    <title>Lientjie Meiring · Architecture</title>
    <!--
      One request for every family the site actually renders.

      This used to fetch Playfair Display (which nothing renders - it was only
      a fallback behind Cormorant) while the fonts that DO render, Cormorant
      Garamond and IBM Plex Mono, were pulled by an @import inside global.css.
      An @import nested in a stylesheet cannot start until that stylesheet has
      been downloaded and parsed, so the real fonts sat behind a four-hop
      waterfall: html -> global.css -> Google CSS -> font files. They swapped
      in around 940ms and reflowed the hero, which was the entire source of
      the page's load-time layout shift (CLS 0.094; 0.0007 with fonts blocked).

      Declared here as a plain <link> instead, it starts in the preload
      scanner alongside the HTML.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
